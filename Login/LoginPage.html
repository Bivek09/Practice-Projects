<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Macondo+Swash+Caps&display=swap" rel="stylesheet">

<link rel="stylesheet" href="Login.css">
<body>
    <div class="login-container">
        <h1>Register thy name here</h1>
        <form action="login.php" method="get">
            <label for="username">Moniker:</label>
            <input type="text" id="username" name="username" required placeholder="Enter thy moniker">
            <br> <br>
            <label for="email">Scroll of Contact:</label>
            <input type="email" id="email" name="email" required placeholder="Enter thy scroll of contact">
            <br> <br>
            <label for="password">Incantation:</label>
            <input type="password" id="password" name="password" required placeholder="Enter thy incantation">
            <br> <br>
            <button id="submit" type="submit">Enter</button>
        </form>
        <a  id="forgot-password" href="#">Forgot your Incantation?</a>
    </div>
    
</body>
</html>
